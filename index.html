<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cabbage Camera</title>
  <style>
    :root {
      --dagreen: rgb(36, 221, 35);
      --dayellow: rgb(255, 237, 182);
      --daorange: rgb(250, 134, 37);
      --birthday-pink: rgb(255, 105, 180);
      --birthday-purple: rgb(147, 112, 219);
      --birthday-blue: rgb(100, 149, 237);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', Courier, monospace;
      background: linear-gradient(135deg,
          var(--dayellow) 0%,
          rgb(255, 220, 220) 50%,
          rgb(220, 230, 255) 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '🎉 🎂 🎈 🎁 🥳 🎊 🎉 🎂 🎈 🎁 🥳 🎊';
      position: fixed;
      top: 10px;
      left: 0;
      right: 0;
      font-size: 24px;
      text-align: center;
      animation: float 20s linear infinite;
      pointer-events: none;
    }

    @keyframes float {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(100%);
      }
    }

    .container {
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      border: 4px solid transparent;
      background-clip: padding-box;
      position: relative;
      max-width: 600px;
      width: 100%;
    }

    .container::before {
      content: '';
      position: absolute;
      top: -4px;
      left: -4px;
      right: -4px;
      bottom: -4px;
      background: linear-gradient(45deg,
          var(--birthday-pink),
          var(--birthday-purple),
          var(--birthday-blue),
          var(--birthday-pink));
      border-radius: 20px;
      z-index: -1;
      animation: borderRotate 3s linear infinite;
    }

    @keyframes borderRotate {
      0% {
        filter: hue-rotate(0deg);
      }

      100% {
        filter: hue-rotate(360deg);
      }
    }

    #logo {
      width: 120px;
      height: auto;
      margin: 0 auto 20px;
      display: block;
    }

    h1 {
      text-align: center;
      background: linear-gradient(45deg,
          var(--birthday-pink),
          var(--birthday-purple),
          var(--birthday-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
      font-size: 2em;
      font-weight: bold;
    }

    .birthday-subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
      font-size: 1.1em;
    }

    #video-container {
      position: relative;
      width: 100%;
      max-height: 400px;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #crop-guide {
      position: absolute;
      border: 3px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      z-index: 10;
      display: none;
    }

    #crop-guide::after {
      content: 'Photo will be cropped to this area';
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 12px;
      white-space: nowrap;
    }

    #video {
      width: 100%;
      max-height: 400px;
      display: block;
      transform: scaleX(-1);
      object-fit: contain;
      /* Mirror the video for selfie mode */
    }

    #canvas {
      display: none;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    button {
      padding: 18px 30px;
      font-size: 18px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #start-camera-btn {
      background: linear-gradient(135deg, var(--birthday-pink), var(--birthday-purple));
      color: white;
    }

    #start-camera-btn:hover {
      background: linear-gradient(135deg, var(--birthday-purple), var(--birthday-blue));
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(255, 105, 180, 0.5);
    }

    #capture-btn {
      background: linear-gradient(135deg, var(--birthday-blue), var(--birthday-pink));
      color: white;
      display: none;
    }

    #capture-btn:hover {
      background: linear-gradient(135deg, var(--birthday-pink), var(--birthday-blue));
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(100, 149, 237, 0.5);
    }

    #capture-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      text-align: center;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
      font-weight: 500;
      display: none;
    }

    .message.success {
      background: #c6f6d5;
      color: #22543d;
      display: block;
    }

    .message.error {
      background: #fed7d7;
      color: #742a2a;
      display: block;
    }

    .message.info {
      background: #bee3f8;
      color: #2c5282;
      display: block;
    }

    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      margin-left: 10px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 20px;
      }

      h1 {
        font-size: 1.5em;
      }

      button {
        padding: 15px 25px;
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <img id="logo" src="the-cabbage.png" alt="Cabbage Town Logo">
    <h1>cabbage.town camera</h1>

    <div id="video-container">
      <video id="video" autoplay playsinline></video>
      <div id="crop-guide"></div>
    </div>

    <canvas id="canvas"></canvas>

    <div class="controls">
      <button id="start-camera-btn">Start Camera</button>
      <button id="capture-btn">🎉 Snap Birthday Pic!</button>
    </div>

    <div id="message" class="message"></div>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const startCameraBtn = document.getElementById('start-camera-btn');
    const captureBtn = document.getElementById('capture-btn');
    const message = document.getElementById('message');
    const videoContainer = document.getElementById('video-container');
    const cropGuide = document.getElementById('crop-guide');

    let stream = null;
    const TARGET_ASPECT_RATIO = 16 / 9; // Landscape crop

    // Calculate and show crop guide
    function updateCropGuide() {
      const containerRect = videoContainer.getBoundingClientRect();
      const videoAspect = video.videoWidth / video.videoHeight;
      const containerAspect = containerRect.width / containerRect.height;

      // Calculate how the video is displayed with object-fit: contain
      let displayedVideoWidth, displayedVideoHeight;

      if (videoAspect > containerAspect) {
        // Video is wider - width fills container
        displayedVideoWidth = containerRect.width;
        displayedVideoHeight = displayedVideoWidth / videoAspect;
      } else {
        // Video is taller - height fills container
        displayedVideoHeight = containerRect.height;
        displayedVideoWidth = displayedVideoHeight * videoAspect;
      }

      // Calculate crop guide dimensions for 16:9
      let cropWidth, cropHeight;

      if (videoAspect > TARGET_ASPECT_RATIO) {
        // Video is wider than 16:9, crop sides
        cropHeight = displayedVideoHeight;
        cropWidth = cropHeight * TARGET_ASPECT_RATIO;
      } else {
        // Video is taller than 16:9, crop top/bottom
        cropWidth = displayedVideoWidth;
        cropHeight = cropWidth / TARGET_ASPECT_RATIO;
      }

      cropGuide.style.width = cropWidth + 'px';
      cropGuide.style.height = cropHeight + 'px';
      cropGuide.style.display = 'block';
    }

    // Start camera
    startCameraBtn.addEventListener('click', async () => {
      try {
        // Request rear camera on mobile devices
        const constraints = {
          video: {
            facingMode: 'user', // 'user' for front camera, 'environment' for rear
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        };

        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;

        // Wait for video to load metadata
        await new Promise(resolve => {
          video.addEventListener('loadedmetadata', resolve, { once: true });
        });

        startCameraBtn.style.display = 'none';
        captureBtn.style.display = 'block';
        videoContainer.style.display = 'block';

        // Show crop guide after a short delay to ensure video is rendered
        setTimeout(() => {
          updateCropGuide();
        }, 100);

        showMessage('Camera ready! Strike a pose! 🎉', 'success');
        setTimeout(() => hideMessage(), 2000);
      } catch (error) {
        console.error('Error accessing camera:', error);
        showMessage('Unable to access camera. Please check permissions.', 'error');
      }
    });

    // Capture and upload photo
    captureBtn.addEventListener('click', async () => {
      try {
        captureBtn.disabled = true;
        showMessage('Taking photo...', 'info');

        // Check if video has valid dimensions
        if (video.videoWidth === 0 || video.videoHeight === 0) {
          throw new Error('Video not ready. Please wait a moment.');
        }

        // Calculate crop area in video coordinates
        const videoAspect = video.videoWidth / video.videoHeight;
        let cropWidth, cropHeight, cropX, cropY;

        if (videoAspect > TARGET_ASPECT_RATIO) {
          // Video is wider, crop sides
          cropHeight = video.videoHeight;
          cropWidth = cropHeight * TARGET_ASPECT_RATIO;
          cropX = (video.videoWidth - cropWidth) / 2;
          cropY = 0;
        } else {
          // Video is taller, crop top/bottom
          cropWidth = video.videoWidth;
          cropHeight = cropWidth / TARGET_ASPECT_RATIO;
          cropX = 0;
          cropY = (video.videoHeight - cropHeight) / 2;
        }

        // Set canvas to cropped size
        canvas.width = cropWidth;
        canvas.height = cropHeight;

        // Draw cropped and flipped video frame to canvas
        const ctx = canvas.getContext('2d');
        ctx.scale(-1, 1); // Flip horizontally
        ctx.drawImage(
          video,
          cropX, cropY, cropWidth, cropHeight, // Source crop
          -cropWidth, 0, cropWidth, cropHeight  // Destination (flipped)
        );
        ctx.setTransform(1, 0, 0, 1, 0, 0); // Reset transform

        // Convert canvas to blob
        const blob = await new Promise((resolve, reject) => {
          canvas.toBlob((b) => {
            if (b) {
              resolve(b);
            } else {
              reject(new Error('Failed to capture image'));
            }
          }, 'image/jpeg', 0.9);
        });

        // Upload to server
        showMessage('Uploading... <span class="loading"></span>', 'info');

        const formData = new FormData();
        formData.append('image', blob, `photo_${Date.now()}.jpg`);

        // const response = await fetch('http://localhost:8080/api/birthday', {
        const response = await fetch('https://shed.cabbage.town/api/birthday', {
          method: 'POST',
          body: formData
        });

        if (response.ok) {
          showMessage('Birthday memory saved! 🎂🎈🎊', 'success');
          setTimeout(() => hideMessage(), 3000);
        } else {
          throw new Error('Upload failed');
        }
      } catch (error) {
        console.error('Error uploading photo:', error);
        showMessage('Upload failed. Please try again.', 'error');
      } finally {
        captureBtn.disabled = false;
      }
    });

    // Helper functions
    function showMessage(text, type) {
      message.innerHTML = text;
      message.className = `message ${type}`;
    }

    function hideMessage() {
      message.className = 'message';
    }

    // Update crop guide on window resize
    window.addEventListener('resize', () => {
      if (stream && video.videoWidth > 0) {
        updateCropGuide();
      }
    });

    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
    });
  </script>
</body>

</html>
