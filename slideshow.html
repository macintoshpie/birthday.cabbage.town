<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Party Photos Slideshow</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(-45deg,
          #ee7752,
          #e73c7e,
          #23a6d5,
          #23d5ab,
          #7c3aed,
          #f59e0b);
      background-size: 400% 400%;
      animation: gradientShift 8s ease infinite;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    @keyframes gradientShift {
      0% {
        background-position: 0% 50%;
      }

      25% {
        background-position: 50% 100%;
      }

      50% {
        background-position: 100% 50%;
      }

      75% {
        background-position: 50% 0%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .slideshow-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .slide {
      position: absolute;
      width: 300%;
      height: 300%;
      top: -100%;
      left: -100%;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
      background-repeat: repeat;
      /* Adjust this to scale the tiled images: increase = larger tiles, decrease = smaller tiles */
      background-size: 30vmin auto;
      animation: bounceAround 50s ease-in-out infinite;
    }

    .slide.active {
      opacity: 1;
      z-index: 1;
    }

    @keyframes bounceAround {
      0% {
        background-position: 0% 0%;
      }

      25% {
        background-position: -30% -15%;
      }

      50% {
        background-position: -60% -50%;
      }

      75% {
        background-position: -30% -70%;
      }

      100% {
        background-position: 0% 0%;
      }
    }

    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.5s ease-out;
    }

    .loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-text {
      color: white;
      font-size: 24px;
      margin-bottom: 30px;
      font-weight: 600;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 5px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .info-bar {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 15px 20px;
      border-radius: 10px;
      font-size: 14px;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .error-message {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(220, 38, 38, 0.95);
      color: white;
      padding: 30px 40px;
      border-radius: 15px;
      font-size: 18px;
      text-align: center;
      z-index: 999;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    @media (max-width: 768px) {
      .info-bar {
        bottom: 10px;
        right: 10px;
        left: 10px;
        text-align: center;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <div class="loading-screen" id="loading-screen">
    <div class="loading-text">Loading photos...</div>
    <div class="spinner"></div>
  </div>

  <div class="slideshow-container" id="slideshow-container">
    <!-- Slides will be dynamically added here -->
  </div>

  <div class="info-bar" id="info-bar">
    <span id="photo-count">0 photos</span>
  </div>

  <div class="error-message" id="error-message">
    Unable to load photos. Retrying...
  </div>

  <script>
    const slideshowContainer = document.getElementById('slideshow-container');
    const loadingScreen = document.getElementById('loading-screen');
    const photoCount = document.getElementById('photo-count');
    const errorMessage = document.getElementById('error-message');

    let currentImages = [];
    let currentSlideIndex = 0;
    let slideshowInterval = null;
    let isFirstLoad = true;

    // Configuration
    const POLL_INTERVAL = 8000; // Poll every 8 seconds
    const SLIDE_DURATION = 4000; // Show each slide for 4 seconds
    const BUCKET_URL = 'https://cabbagetown.nyc3.digitaloceanspaces.com';

    // Fetch images from Digital Ocean Spaces bucket
    async function fetchImages() {
      try {
        const res = await fetch(`${BUCKET_URL}/?list-type=2&prefix=birthday/`);

        if (!res.ok) {
          throw new Error('Failed to fetch images');
        }

        const text = await res.text();
        const xml = new DOMParser().parseFromString(text, "application/xml");
        const urls = [...xml.getElementsByTagName("Key")]
          .map(n => n.textContent)
          .filter(key => {
            // Filter out directories (keys ending with /)
            if (key.endsWith('/')) return false;
            // Only include image files
            const ext = key.toLowerCase().split('.').pop();
            return ['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext);
          })
          .map(key => `${BUCKET_URL}/${key}`);

        return urls;
      } catch (error) {
        console.error('Error fetching images:', error);
        showError();
        return null;
      }
    }

    // Update slideshow with new images
    function updateSlideshow(imageUrls) {
      if (!imageUrls || imageUrls.length === 0) {
        if (isFirstLoad) {
          photoCount.textContent = 'No photos yet';
        }
        return;
      }

      console.log(imageUrls);

      // Check if images have changed
      const urlsChanged = JSON.stringify(imageUrls) !== JSON.stringify(currentImages);

      if (urlsChanged) {
        currentImages = imageUrls;
        photoCount.textContent = `${imageUrls.length} photo${imageUrls.length !== 1 ? 's' : ''}`;

        // Clear existing slides
        slideshowContainer.innerHTML = '';

        // Create slides with repeating background images
        imageUrls.forEach((url, index) => {
          const slide = document.createElement('div');
          slide.className = 'slide';
          slide.style.backgroundImage = `url(${url})`;
          slideshowContainer.appendChild(slide);
        });

        // Reset slideshow
        currentSlideIndex = 0;
        showSlide(0);

        // Restart slideshow interval
        if (slideshowInterval) {
          clearInterval(slideshowInterval);
        }
        startSlideshow();
      }

      if (isFirstLoad) {
        hideLoading();
        isFirstLoad = false;
      }
    }

    // Show specific slide
    function showSlide(index) {
      const slides = document.querySelectorAll('.slide');

      if (slides.length === 0) return;

      // Remove active class from all slides
      slides.forEach(slide => slide.classList.remove('active'));

      // Add active class to current slide
      if (slides[index]) {
        slides[index].classList.add('active');
      }
    }

    // Advance to next slide
    function nextSlide() {
      const slides = document.querySelectorAll('.slide');

      if (slides.length === 0) return;

      currentSlideIndex = (currentSlideIndex + 1) % slides.length;
      showSlide(currentSlideIndex);
    }

    // Start slideshow
    function startSlideshow() {
      slideshowInterval = setInterval(nextSlide, SLIDE_DURATION);
    }

    // Hide loading screen
    function hideLoading() {
      loadingScreen.classList.add('hidden');
    }

    // Show error message
    function showError() {
      errorMessage.classList.add('show');
      setTimeout(() => {
        errorMessage.classList.remove('show');
      }, 3000);
    }

    // Poll for new images
    async function pollImages() {
      const imageUrls = await fetchImages();
      if (imageUrls !== null) {
        updateSlideshow(imageUrls);
      }
    }

    // Initialize
    async function init() {
      // Initial load
      await pollImages();

      // Set up polling
      setInterval(pollImages, POLL_INTERVAL);
    }

    // Start the slideshow
    init();
  </script>
</body>

</html>
